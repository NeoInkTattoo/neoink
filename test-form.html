<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Neo Ink — тест формы (не для клиентов)</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141414;color:#eee;font:16px/1.5 Arial,sans-serif;padding:24px}
main{width:min(100%,460px);padding:32px;border:1px solid #514540;border-radius:12px;background:#1d1a19}h1{margin:0 0 8px;font-size:28px}p{color:#c2bab6}label{display:block;margin:18px 0 7px}input{display:block;width:100%;padding:13px;border:1px solid #776962;background:#24201e;color:white;border-radius:6px;font:inherit}button{margin-top:24px;width:100%;border:0;border-radius:6px;padding:14px;background:#8b2925;color:white;font:inherit;cursor:pointer}button:hover{background:#a8332c}.note{font-size:13px}#result{min-height:24px}
</style>
</head>
<body>
<main>
<h1>Тест формы Neo Ink</h1>
<p>Это учебная форма. Форма подключена к тестовому обработчику Formspree. <strong>Используйте только вымышленные данные</strong>, не отправляйте реальные телефоны.</p>
<form id="testForm" action="https://formspree.io/f/mzeevrna" method="POST">
<label for="name">Имя</label><input id="name" name="name" autocomplete="off" maxlength="80" required placeholder="Тест">
<label for="phone">Телефон (вымышленный)</label><input id="phone" name="phone" type="tel" autocomplete="off" maxlength="25" required placeholder="+7 000 000-00-00">
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><button type="submit" id="sendButton">Отправить тестовую заявку</button>
<p id="result" role="status" aria-live="polite"></p>
</form>
<p class="note">Заявки отправляются во внешний тестовый сервис Formspree. Не используйте эту страницу для сбора реальных персональных данных.</p>
</main>
<script>
document.querySelector('#testForm').addEventListener('submit',async function(e){
e.preventDefault();
const form=e.currentTarget, status=document.querySelector('#result'), button=document.querySelector('#sendButton');
button.disabled=true;status.textContent='Отправляем тестовую заявку…';
try{
const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});
if(!response.ok) throw new Error('Server rejected submission');
status.textContent='Заявка принята Formspree! Проверьте раздел Submissions и уведомления на почте.';
form.reset();
}catch(error){status.textContent='Не удалось отправить заявку. Проверьте подключение и настройки формы Formspree.';}
finally{button.disabled=false;}
});
</script>
</body>
</html>
